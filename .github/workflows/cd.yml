name: CD

on:
  push:
    branches:
      - main
      - develop
      - 'feature/**'
  pull_request:
    branches:
      - main

jobs:
  build-docker:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
      - name: Build Docker image
        run: docker build -t gerador-senhas-banco:latest .
      - name: Validate Docker image
        run: docker images gerador-senhas-banco:latest
